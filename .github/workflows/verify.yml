name: Verify tabletop print-and-play

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tabletop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate tabletop cards and one-sheet rules
        run: npm test
      - name: Check printed card audit and seeded balance report
        run: |
          npm run audit
          npm run balance:baseline -- 120
      - name: Compare complete-effect strategies across solo and cooperative expeditions
        run: npm run balance -- 2000
      - name: Verify physical card print, A4 and responsive preview
        run: npm run test:visual
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tabletop-print-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
