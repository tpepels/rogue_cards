name: Verify prototype

on:
  push:
    branches: [main, design/phase-1-foundation]
  pull_request:
  workflow_dispatch:

# Informational checks only. GitHub Pages deploys from main / root independently.
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tooling
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Engine and presentation unit tests
        run: npm test
      - name: Deterministic Phase 6 expedition balance report
        run: npm run sim:phase6
      - name: Browser layout, interaction, and A4 print geometry
        run: npm run test:visual
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
