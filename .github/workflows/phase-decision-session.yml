name: Player decision session checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-decision-session.yml
      - src/engine/decision-session.js
      - src/engine/index.js
      - src/engine/expedition-state.js
      - src/rooms.js
      - src/room-effect-model.js
      - src/playtest.js
      - tests/decision-api.test.mjs
      - src/engine/combat.js
      - src/engine/random.js
      - src/engine/fork-state.js
      - src/session-mcts.js
      - scripts/run-session-mcts.mjs
      - scripts/study-session-agent.mjs
      - src/session-agent.js
      - tests/session-agent.test.mjs
      - src/rollout-state.js
      - tests/session-mcts.test.mjs
      - src/engine/parley.js
      - src/engine/combat-outcomes.js
      - src/engine/vault-encounter.js
      - src/expedition-campaign.js
      - tests/decision-session.test.mjs

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate pausable game and printed mechanics
        run: |
          npm run test:session
          npm run test:rollout
          npm run validate:deck
          npm run oracle:mcts -- --heroes warrior --seed 555 \
            --budget 2 --knowledge fair --out results/session-mcts-smoke.json
      - name: Smoke-test a complete actual game using only MCTS legal decisions
        run: |
          npm run oracle:play -- --runs 1 --workers 1 --hours 1 \
            --budget 1 --knowledge fair --seed 551133 \
            --out results/session-agent-ci
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('results/session-agent-ci/summary.json','utf8'));
          const audit=JSON.parse(readFileSync('results/session-agent-ci/validation.json','utf8'));
          if(!report.complete||report.finishedIndependentSeeds!==1||
             audit.nonterminalExpeditionsAccepted!==false)
            throw Error('A seeded actual expedition was not completed');
          if(report.totalActualDecisions===0||report.UCTDecisions===0)
            throw Error('The agent never actually branched and played');
          if(audit.completeActionSearchImplemented)
            throw Error('Premature claims of all timing-window coverage');
          NODE
      - name: Exercise all eight solo Heroes and every real reaction type
        run: |
          npm run oracle:play -- --runs 8 --workers 4 --hours 1 \
            --budget 2 --knowledge fair --seed 551134 \
            --out results/session-agent-eight-heroes
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('results/session-agent-eight-heroes/summary.json','utf8'));
          if(!r.complete||r.finishedIndependentSeeds!==8||r.UCTDecisions<=8)
            throw Error('Full-fidelity MCTS was not exercised across eight solo Heroes');
          for(const hero of ['warrior','knight','wizard','witch','rogue','thief','priest','monk'])
            if(!r.byParty[hero])throw Error('Missing solo Hero '+hero);
          NODE
      - name: Upload actual-session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-agent-smoke
          path: |
            results/session-agent-ci/
            results/session-agent-eight-heroes/
          if-no-files-found: ignore
      - name: Record verified revision
        if: success()
        run: echo "Verified $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
