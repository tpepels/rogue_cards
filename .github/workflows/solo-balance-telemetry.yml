name: Full solo balance telemetry proof
on:
  push:
    branches: [main]
    paths:
      - 'scripts/study-solo-expedition-balance.mjs'
      - 'scripts/report-solo-balance-details.mjs'
      - 'src/experiment-telemetry.js'
      - 'src/session-policy.js'
      - 'src/session-mcts.js'
      - 'src/solo-pragmatic.js'
      - 'tests/mcts-pragmatic-simulation.test.mjs'
      - 'scripts/run-pragmatic-ablation.sh'
      - 'scripts/report-pragmatic-ablation.mjs'
      - 'scripts/audit-monster-frequency.mjs'
      - 'scripts/tune-solo-coarse.mjs'
      - 'scripts/tune-mcts-hybrid-core.mjs'
      - 'tests/solo-coarse-tuner.test.mjs'
      - 'package.json'
      - 'src/staging/catalogue.js'
      - 'src/rollout-state.js'
      - 'src/engine/expedition-state.js'
      - 'src/engine/decision-session.js'
      - 'src/engine/index.js'
      - 'src/engine/vault-encounter.js'
      - 'src/engine/fork-state.js'
      - 'scripts/study-card-staging.mjs'
      - 'tests/card-staging.test.mjs'
      - 'experiments/staging/**'
      - 'experiments/agents/**'
      - 'tests/solo-equipment-frequency.test.mjs'
      - 'tests/solo-pragmatic-policy.test.mjs'
      - 'tests/solo-expedition-balance.test.mjs'
      - '.github/workflows/solo-balance-telemetry.yml'
  workflow_dispatch:
jobs:
  trace-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test efficient solo equipment policy and printed Monster exposure
        run: npm run test:solo:equipment-frequency
      - name: Prove deterministic HP, reward and parley shortcuts
        run: npm run test:solo:pragmatic
      - name: Validate four-mode ablation scripts
        run: |
          node --check scripts/report-pragmatic-ablation.mjs
          bash -n scripts/run-pragmatic-ablation.sh
          node scripts/study-solo-expedition-balance.mjs --dry-run --mcts-pragmatic tree-only --runs-per-hero 2 --heuristic solo-threat
          node scripts/study-solo-expedition-balance.mjs --dry-run --mcts-pragmatic rollout-only --runs-per-hero 2 --heuristic solo-threat
      - name: Verify coarse MCTS tuning grid and independent validation
        run: npm run test:solo:coarse
      - name: Exercise resumable coarse tuning workers on tiny paired grid
        run: |
          node scripts/tune-solo-coarse.mjs \
            --workers 2 --minutes 3 --screen-groups 1 \
            --holdout-groups 1 --holdout-repetitions 1 \
            --candidate-limit 2 --out "$RUNNER_TEMP/solo-coarse-smoke"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+
              "/solo-coarse-smoke/summary.json","utf8"));
            if(!r.completeScreen||!r.completeValidation||
              r.recommendedForProduction!==false)
              throw Error("Coarse MCTS trial was incomplete or automatically promoted");
          '
      - name: Exercise unseen-group refinement workers and final validation
        run: |
          node scripts/tune-solo-coarse.mjs \
            --profile refine --workers 8 --minutes 3 \
            --candidate-limit 4 --screen-repetitions 1 \
            --holdout-repetitions 1 --finalists 1 \
            --out "$RUNNER_TEMP/solo-refine-smoke"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const s=JSON.parse(readFileSync(process.env.RUNNER_TEMP+
              "/solo-refine-smoke/summary.json","utf8"));
            if(!s.completeScreen||!s.completeValidation||
              s.schema!=="solo-mcts-refinement-v1")
              throw Error("Numerical refinement did not complete both phases");
            if(s.expectedScreen!==576||s.holdoutScenarioCount!==48)
              throw Error("Invalid refinement sample plan");
          '
      - name: Prove canonical/staging isolation and matched card studies
        run: npm run test:card:staging
      - name: Verify staging pilot manifest
        run: |
          npm run study:card:staging -- --stage experiments/staging/wisp-hp-8.json --runs-per-hero 1 --dry-run
      - name: Execute real paired staging study and verify immutable resume
        run: |
          npm run study:card:staging -- \
            --stage experiments/staging/wisp-hp-8.json \
            --runs-per-hero 1 --workers 2 --minutes 8 \
            --heroes warrior,witch \
            --out "$RUNNER_TEMP/staging-paired-smoke"
          npm run study:card:staging -- \
            --stage experiments/staging/wisp-hp-8.json \
            --runs-per-hero 1 --workers 2 --minutes 8 \
            --heroes warrior,witch \
            --out "$RUNNER_TEMP/staging-paired-smoke"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const root=process.env.RUNNER_TEMP+"/staging-paired-smoke/";
            const result=JSON.parse(readFileSync(root+"summary.json","utf8"));
            const lines=readFileSync(root+"trials.ndjson","utf8").trim().split("\n");
            if(!result.complete||result.pairedExpeditions!==2||lines.length!==4||
              !result.deckComposition?.canonical?.rooms?.UPPER||
              !result.byCard?.staging?.monsterVisits)
              throw Error("Staging comparison failed pairing/resume/deck audit");
          '
      - name: Audit printed regional Monster odds
        run: npm run audit:monster-frequency
      - name: Prove complete canonical solo decision traces and detailed reports
        run: npm run test:solo:balance
