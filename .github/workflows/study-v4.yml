name: V4 Gameplay Coherence Study

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Full expeditions per party / strategy / policy (1-200)"
        type: number
        default: 80
        required: true
      choice_runs:
        description: "Matched initial seeds per retained fate Room (1-1000)"
        type: number
        default: 1000
        required: true
      seed:
        description: "Starting seed"
        type: number
        default: 20261013
        required: true
      party_set:
        description: "Party cohort"
        type: choice
        options: [compact, solo, all]
        default: compact
  push:
    branches: [main]
    paths:
      - .github/workflows/study-v4.yml
      - scripts/study-v4-coherence.mjs
      - tests/v4-coherence.test.mjs

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate canonical card and effect agreement
        run: npm run validate:deck
      - name: Check the V4 experimental study contract
        run: node --test tests/v4-coherence.test.mjs
      - name: Study V4 policy coherence and matched choices
        env:
          RUNS: ${{ inputs.runs || '80' }}
          CHOICE_RUNS: ${{ inputs.choice_runs || '1000' }}
          STUDY_SEED: ${{ inputs.seed || '20261013' }}
          PARTY_SET: ${{ inputs.party_set || 'compact' }}
        run: |
          npm run study:v4 -- \
            --runs "$RUNS" --choice-runs "$CHOICE_RUNS" \
            --seed "$STUDY_SEED" --party-set "$PARTY_SET" \
            --out results/v4-coherence-ci
      - name: Publish results summary
        if: success()
        run: cat results/v4-coherence-ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full result data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rogue-cards-v4-coherence
          path: results/v4-coherence-ci/
          if-no-files-found: warn
