name: Combat diagnostic regression

on:
  push:
    branches: [main]
    paths:
      - 'scripts/study-combat-causes.mjs'
      - 'scripts/study-combat-phase2b.mjs'
      - 'scripts/study-combat-phase2c.mjs'
      - 'scripts/bench-mcts-combat-hybrids.mjs'
      - 'scripts/tune-mcts-hybrid.mjs'
      - 'scripts/tune-mcts-hybrid-core.mjs'
      - 'scripts/audit-implicit-heuristic.mjs'
      - 'scripts/study-mcts-factorial.mjs'
      - 'scripts/solo-encounter-fixtures.mjs'
      - 'scripts/study-mcts-solo-overnight.mjs'
      - 'scripts/study-solo-expedition-balance.mjs'
      - 'src/combat-rollout-expectimax.js'
      - 'src/mcts-implicit.js'
      - 'src/mcts-hybrid-defaults.js'
      - 'src/session-mcts.js'
      - 'src/session-policy.js'
      - 'tests/combat-causes-diagnostic.test.mjs'
      - 'tests/combat-phase2b.test.mjs'
      - 'tests/combat-phase2c.test.mjs'
      - 'tests/mcts-combat-hybrids.test.mjs'
      - 'tests/mcts-implicit-tuner.test.mjs'
      - 'tests/mcts-heuristic-factorial.test.mjs'
      - 'tests/mcts-solo-overnight.test.mjs'
      - 'tests/solo-expedition-balance.test.mjs'
      - 'src/engine/**'
      - 'src/monster-expansion.js'
      - 'src/tabletop-data.js'
      - 'package.json'
      - '.github/workflows/combat-diagnostics.yml'
  pull_request:
    paths:
      - 'scripts/study-combat-causes.mjs'
      - 'tests/combat-causes-diagnostic.test.mjs'
      - 'src/engine/**'
      - 'src/monster-expansion.js'
      - 'src/tabletop-data.js'
      - 'package.json'
      - '.github/workflows/combat-diagnostics.yml'
  workflow_dispatch:

jobs:
  combat-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical complete-encounter settlement
        run: npm run test:diagnose
      - name: Verify Phase 2b realistic scenarios and paired reproducibility
        run: npm run test:phase2b
      - name: Verify Phase 2c risk and independent dice replicate controls
        run: npm run test:phase2c
      - name: Verify UCT combat expectimax and implicit backups
        run: npm run test:mcts-combat-hybrids
      - name: Verify reproducible C-alpha tuner and independent fitness
        run: npm run test:mcts-implicit-tuner
      - name: Verify independent heuristic and expectimax factorial experiments
        run: npm run test:mcts-heuristic-factorial
      - name: Smoke audit implicit Hero ranking across Monsters
        run: npm run audit:mcts-implicit-heuristic -- --repetitions 2 --eval-seeds 4 --out results/implicit-audit-ci
      - name: Smoke factorial sampled expectimax versus implicit UCT
        run: npm run study:mcts-factorial -- --mode equal-visits --workers 2 --minutes 3 --seed 20261023 --scenarios 8 --repetitions 1 --budget 8 --c 0.35 --alpha 0.4 --out results/mcts-factorial-ci
      - name: Verify recursive implicit MAX backups, solo-only studies and resumable workers
        run: npm run test:mcts-solo-overnight
      - name: Verify full 36-Room solo expedition balance study
        run: npm run test:solo:balance
      - name: Compare Phase 2 policies on matched encounters
        run: npm run study:diagnose:phase2 -- --trials 2 --samples 2 --monsters crawler,wisp,troll,sentinel --out results/phase2-ci-pilot
      - name: Compare Phase 2b policies on 48 realistic combat states
        run: npm run study:diagnose:phase2b -- --scenarios 48 --samples 2 --followup 2 --out results/phase2b-ci-full
      - name: Compare Phase 2c policies on matched repeated combat states
        run: npm run study:diagnose:phase2c -- --scenarios 6 --repetitions 2 --samples 2 --followup 1 --out results/phase2c-ci-smoke
      - name: Upload paired combat study results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-paired-combat-pilot
          path: |
            results/phase2-ci-pilot/
            results/phase2b-ci-full/
            results/phase2c-ci-smoke/
            results/implicit-audit-ci/
            results/mcts-factorial-ci/
          if-no-files-found: ignore
